[project]
name = "domdb"
version = "0.1.5"
description = "Tools for citing Danish judicial verdicts in LaTeX"
authors = [{ name = "evid", email = "95282593+evidlabel@users.noreply.github.com" }]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "requests>=2.32.3,<3",
    "bibtexparser>=1.2.0,<2",
    "pyyaml>=6.0.0,<7",
    "pydantic>=2.0.0,<3",
    "pdfplumber",
    "evid @ git+https://github.com/evidlabel/evid.git",
    "treeparse>=0.3.1",
    "loguru>=0.7.3",
]

[project.scripts]
domdb = "domdb.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8",
    "pytest-cov>=3.0.0,<4",
    "pytest-mock>=3.10.0,<4",
    "black>=23.0.0,<24",
    "flake8>=6.0.0,<7",
    "mkdocs>=1.5.3,<2",
    "mkdocs-material>=9.5.0,<10",
    "mkdocstrings>=0.24.0,<0.25",
    "mkdocs-autorefs>=0.5.0,<0.6",
    "ruff>=0.1.0,<1",
    "pre-commit",
]

[tool.hatch.build.targets.sdist]
include = ["src/domdb", "SKILL.md"]

[tool.hatch.build.targets.wheel]
include = ["src/domdb"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "domdb/SKILL.md"

[tool.hatch.build.targets.wheel.sources]
"src/domdb" = "domdb"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references=true
# tool.hatch.metadata.allow-direct-references

[tool.pytest.ini_options]
addopts = "-rs --tb=native -s -q --cov=domdb --cov-report=term-missing"
console_output_style = "classic"
log_cli = true
log_cli_level = "WARNING"
log_file = "pytest.log"
log_file_level = "WARNING"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:demoji",
    "ignore::DeprecationWarning:_bootstrap",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
